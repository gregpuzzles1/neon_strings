<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070b16;color:#eef4ff;font-family:system-ui,sans-serif}body{overflow:hidden}button,select,input{font:inherit}button,select{color:#eef4ff;background:#1a1f2e;border:1px solid #2a3142;border-radius:4px;padding:8px 12px;cursor:pointer}button:hover{background:#232839}select{padding:6px 8px;font-size:14px}input[type=range]{cursor:pointer;accent-color:#00d4ff;width:120px}input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:#00d4ff;cursor:pointer;box-shadow:0 0 8px rgba(0,212,255,.6)}input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#00d4ff;cursor:pointer;border:none;box-shadow:0 0 8px rgba(0,212,255,.6)}header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #2a3142}.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:bold}.mark{font-size:32px;color:#00d4ff;animation:wave 2s ease-in-out infinite}@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.intro{padding:20px;text-align:center;font-size:18px}.phrase{font-size:24px;font-weight:bold;margin:0 0 12px;color:#00d4ff}.stage{position:relative;flex:1;width:100%;background:linear-gradient(135deg,#0a0f1a 0%,#0f1420 100%)}.intro,.themes,.bar,footer{flex-shrink:0}.themes{display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 12px 0;flex-shrink:0}.theme-label{font-size:11px;color:#a9b6c9;width:88px}.theme-label strong{display:block;color:#00d4ff;font-weight:bold;margin-bottom:4px}.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #2a3142;cursor:pointer;transition:all .2s ease}.swatch:hover{transform:scale(1.1)}.swatch.active{border-color:#00d4ff;box-shadow:0 0 12px rgba(0,212,255,.8)}.bar{display:flex;justify-content:center;align-items:center;gap:20px;padding:20px;flex-wrap:wrap}.control{display:flex;align-items:center;gap:8px}.control label{font-size:14px;color:#a9b6c9}footer{padding:12px 20px;text-align:center;font-size:12px;color:#505968;border-top:1px solid #2a3142}.sound{width:44px;height:44px;border-radius:50%;padding:0;display:flex;justify-content:center;align-items:center;font-size:18px;background:#1a2844;color:#00d4ff}.sound:hover{background:#233055}.sound:active{transform:scale(.95)}

/* Reserve a consistent label width so theme changes never resize the stage. */
.theme-label{width:94px;flex-shrink:0}.theme-label strong{white-space:nowrap}
@media(max-width:380px){.themes{flex-direction:column;gap:4px}.theme-label{width:auto}.theme-label strong{display:inline;margin-left:5px}}

/* Avoid double-tap zoom on controls; retain intentional pinch zoom. */
button,select,input,label{touch-action:manipulation}
/* Keep form text large enough to avoid iPhone focus zoom. */
@media(hover:none) and (pointer:coarse){button,select,input,.bar button,.sound{font-size:16px}}

/* Keep playback controls stable when their label changes. */
#demo{width:132px;min-width:132px;height:46px;flex:0 0 132px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}

/* Keep mood, volume and playback together; center Reset below them. */
.bar{display:grid;grid-template-columns:auto auto auto;column-gap:16px;row-gap:12px;justify-content:center;align-items:center}
.bar>.control:first-child{grid-column:1;grid-row:1}

#demo{grid-column:3;grid-row:1;width:110px;min-width:110px;height:44px;padding:8px 6px}
#clear{grid-column:1 / -1;grid-row:2;justify-self:center;min-width:88px}
@media(max-width:600px){.bar{width:94vw;grid-template-columns:minmax(0,1fr) 60px 110px;column-gap:8px;padding:12px 10px}.bar .control{min-width:0}.bar select{width:100%;min-width:0;padding:10px 3px}#clear{width:94vw}}
@media(max-width:350px){.bar{grid-template-columns:auto 110px}.bar>.control:first-child{grid-column:1 / -1;grid-row:1;justify-self:center}.bar>.control:nth-child(2){grid-column:1;grid-row:2}#demo{grid-column:2;grid-row:1 / 3;width:110px;min-width:110px;height:auto;padding:6px}#clear{grid-column:1 / -1;grid-row:3;width:100%}}

/* Equal side columns keep the mobile volume slider on the page centerline. */
@media(min-width:351px) and (max-width:600px){.bar{grid-template-columns:110px 60px 110px}.bar>.control:first-child,.bar select{width:110px}}

/* Keep the canvas inside its allotted space, clear of the theme controls. */

.intro,.themes,.bar,footer{flex-shrink:0}

<header><div class="logo"><span class="mark" aria-hidden="true">≋</span><div><h1>Neon Strings</h1><div class="eyebrow">A little space to play</div></div></div><button id="sound" class="sound" aria-label="Toggle sound" aria-pressed="true">♪</button></header>
<main><div class="intro"><p class="phrase">Touch the light. Find your melody.</p><p>Tap a string or sweep across them to play.</p></div><div class="stage"><canvas id="canvas" tabindex="0" role="application" aria-label="Interactive musical strings. Use keyboard or mouse to play."></canvas></div><div class="themes"><label class="theme-label"><strong>Theme</strong></label><button class="swatch active" data-theme="ocean" aria-label="Ocean theme" style="--swatch:#00d4ff"></button><button class="swatch" data-theme="violet" aria-label="Violet theme" style="--swatch:#b366ff"></button><button class="swatch" data-theme="rose" aria-label="Rose theme" style="--swatch:#ff66b2"></button><button class="swatch" data-theme="ember" aria-label="Ember theme" style="--swatch:#ff6644"></button><button class="swatch" data-theme="forest" aria-label="Forest theme" style="--swatch:#44ff88"></button><button class="swatch" data-theme="sunset" aria-label="Sunset theme" style="--swatch:#ffaa44"></button><button class="swatch" data-theme="midnight" aria-label="Midnight theme" style="--swatch:#7777ff"></button></div><div class="bar"><div class="control"><label for="scale">Mood</label><select id="scale"><option value="dream">Dream</option><option value="warm">Warm</option><option value="space">Space</option></select></div><div class="control"><label for="volume">Volume</label><input type="range" id="volume" min="0" max="100" value="50" aria-label="Volume control"></div><button id="demo" aria-label="Toggle auto play" aria-pressed="false">▷ Auto play</button><button id="clear">Reset</button></div><footer id="status">INTERACTIVE MODE</footer></main>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),sound=document.getElementById('sound'),volume=document.getElementById('volume'),scale=document.getElementById('scale'),demo=document.getElementById('demo'),hint=document.querySelector('.intro'),statusEl=document.getElementById('status');
let w=1,h=1,audio,master,wet,muted=false,started=false,autoTimer=null,last=0,time=0;
const count=22,impulses=[],rings=[],particles=[],pointers=new Map(),lastNotes=Array(count).fill(-Infinity),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const moods={dream:[0,2,4,7,9],warm:[0,3,5,7,10],space:[0,2,5,7,10]};

const palettes={ocean:{name:'Ocean blue',hue:200,start:190,span:50},violet:{name:'Violet',hue:270,start:250,span:40},rose:{name:'Rose pink',hue:325,start:305,span:35},ember:{name:'Ember red',hue:0,start:350,span:40},forest:{name:'Forest green',hue:120,start:100,span:50},sunset:{name:'Sunset orange',hue:30,start:10,span:50},midnight:{name:'Midnight blue',hue:240,start:220,span:50}};
let palette=palettes.ocean;
function setTheme(key,persist=true){if(!Object.hasOwn(palettes,key))key='ocean';palette=palettes[key];document.documentElement.style.setProperty('--hue',palette.hue);document.getElementById('theme-select')?.setAttribute('value',key);if(persist)try{localStorage.setItem('neonStringsTheme',key)}catch{}}
document.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>setTheme(button.dataset.theme)));
let savedTheme='ocean';try{savedTheme=localStorage.getItem('neonStringsTheme')||'ocean'}catch{}setTheme(savedTheme,false);

function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function yFor(i){return 22+i*(h-44)/(count-1)}function indexAt(y){return Math.max(0,Math.min(count-1,Math.round((y-22)/(h-44)*(count-1))))}
async function enable(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){statusEl.textContent='AUDIO UNAVAILABLE — VISUALS STILL PLAY';return false}audio=new AC();master=audio.createGain();master.connect(audio.destination);const LP=audio.createBiquadFilter();LP.type='lowpass';LP.frequency.value=18e3;master.connect(LP);LP.connect(audio.destination);return started=true}}
function updateSound(){sound.textContent=muted?'♪ Sound off':'♪ Sound on';sound.setAttribute('aria-pressed',String(!muted));statusEl.textContent=muted?'SILENT MODE':'SOUND IS ON'}
function note(i,strength){if(!audio||audio.state!=='running'||muted)return;const now=audio.currentTime;if(now-lastNotes[i]<.075)return;lastNotes[i]=now;const notes=moods[scale.value],n=count-1-i,m=notes[n%notes.length],o=Math.floor(n/notes.length),f=440*Math.pow(2,(m+12*o-9)/12),osc=audio.createOscillator(),env=audio.createGain();osc.frequency.value=f;osc.connect(env);env.connect(master);env.gain.setValueAtTime(.3*strength,now);env.gain.exponentialRampToValueAtTime(.01,now+.4);osc.start(now);osc.stop(now+.4)}
function pluck(i,x,strength=1){hint.style.opacity='0';const y=yFor(i);impulses.push({i,x,t:time,amp:Math.min(45,h/count*2)*strength});rings.push({x,y,t:time});for(let k=0;k<(reduced?3:13);k++){const angle=Math.random()*Math.PI*2,speed=2+Math.random()*3;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,t:time,life:.6+Math.random()*.3})}note(i,strength)}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();enable();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);const p=point(e);pointers.set(e.pointerId,p);pluck(indexAt(p.y),p.x)});
canvas.addEventListener('pointermove',e=>{const prev=pointers.get(e.pointerId);if(!prev)return;const p=point(e),a=indexAt(prev.y),b=indexAt(p.y);if(a!==b){const dir=Math.sign(b-a);for(let i=a+dir;i!==b+dir;i+=dir)pluck(i,p.x,.6)}pointers.set(e.pointerId,p)});
function release(e){pointers.delete(e.pointerId)}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
sound.onclick=async()=>{if(!started){await enable();return}muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:+volume.value/100*.32,audio.currentTime,.03);if(!muted)await enable();updateSound()};
volume.oninput=()=>{if(master)master.gain.setTargetAtTime(muted?0:+volume.value/100*.32,audio.currentTime,.03)};
function stopAuto(){clearInterval(autoTimer);autoTimer=null;demo.textContent='▷ Auto play';demo.setAttribute('aria-pressed','false')}
demo.onclick=async()=>{if(autoTimer){stopAuto();return}await enable();let step=0;const tune=[16,12,9,13,16,11,7,12];autoTimer=setInterval(()=>{pluck(tune[step%tune.length],w*(.25+.5*(Math.sin(step*.3)*.5+.5)),Math.random()*.4+.6);step++},200)};
document.getElementById('clear').onclick=()=>{volume.value='50';volume.oninput();stopAuto();impulses.length=rings.length=particles.length=0;pointers.clear();hint.style.opacity='1'};
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;const i='asdfghjk'.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();enable();pluck(i,w/2)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAuto();pointers.clear();audio?.suspend()}else if(started&&!muted)audio?.resume()});
function frame(ms){const dt=Math.min(.05,(ms-last)/1000||.016);last=ms;time+=dt;ctx.clearRect(0,0,w,h);const now=time;for(let i=0;i<count;i++){let energy=0;for(const p of impulses)if(p.i===i)energy+=p.amp*Math.max(0,1-Math.pow((now-p.t)/1.5,2));const y=yFor(i),glow=energy>5?'.8':'.4';ctx.fillStyle=`hsla(${palette.hue},90%,${50+energy}%,1)`;ctx.beginPath();ctx.arc(p.x/2+w/4,y,Math.max(3,energy/3),0,Math.PI*2);ctx.fill();ctx.strokeStyle=`hsla(${palette.hue},90%,75%,${glow})`;ctx.lineWidth=2+energy/15;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
for(let i=impulses.length-1;i>=0;i--)if(now-impulses[i].t>1.5)impulses.splice(i,1);
for(let i=rings.length-1;i>=0;i--){const p=rings[i],age=now-p.t;if(age>1.5){rings.splice(i,1);continue}ctx.strokeStyle=`hsla(${palette.hue},90%,75%,${(1-age/1.5)*.65})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,age*120,0,Math.PI*2);ctx.stroke()}
for(let i=particles.length-1;i>=0;i--){const p=particles[i],age=now-p.t;if(age>p.life){particles.splice(i,1);continue}ctx.fillStyle=`hsla(${palette.hue},90%,75%,${1-age/p.life})`;ctx.beginPath();ctx.arc(p.x+p.vx*age*30,p.y+p.vy*age*30,2,0,Math.PI*2);ctx.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
