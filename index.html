<script>

const moods={dream:[0,2,4,7,9],warm:[0,3,5,7,10],space:[0,2,5,7,10]};

function note(i,strength){if(!audio||audio.state!=='running'||muted)return;const now=audio.currentTime;if(now-lastNotes[i]<.075)return;lastNotes[i]=now;const notes=moods[scale.value],n=count-1-i,midi=45+notes[n%5]+12*Math.floor(n/5),freq=440*2**((midi-69)/12);[1,2,3].forEach((harm,j)=>{const osc=audio.createOscillator(),g=audio.createGain();osc.type='sine';osc.frequency.value=freq*harm;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(strength*(j===0?.34:.045),now+.009);g.gain.exponentialRampToValueAtTime(.0001,now+(j===0?2.3:.7));osc.connect(g);g.connect(master);g.connect(wet);osc.start(now);osc.stop(now+2.4)})}

demo.onclick=async()=>{if(autoTimer){stopAuto();return}await enable();let step=0;const tune=[16,12,9,13,16,11,7,12];autoTimer=setInterval(()=>{pluck(tune[step%tune.length],w*(.25+.5*(Math.sin(step*.8)+1)/2),.7);step++},440);demo.textContent='Ⅱ Pause';demo.setAttribute('aria-pressed','true')};

document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;const i='asdfghjk'.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();enable();pluck(19-i*2,w*.5)}});

for(let i=rings.length-1;i>=0;i--){const p=rings[i],age=now-p.t;if(age>1.5){rings.splice(i,1);continue}ctx.strokeStyle=`hsla(${palette.hue},90%,75%,${(1-age/1.5)*.65})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,5+age*(reduced?20:95),0,Math.PI*2);ctx.stroke();ctx.fillStyle=`hsla(${palette.hue},95%,95%,${Math.max(0,1-age*3)})`;ctx.shadowColor=`hsl(${palette.hue},95%,75%)`;ctx.shadowBlur=24;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
